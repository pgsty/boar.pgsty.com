name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.27.3
  HUGO_VERSION: "0.168.0"
  GOTOOLCHAIN: local

jobs:
  build:
    name: Hugo 0.168.0 / OINK 1.5.0
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          check-latest: true
          cache: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Resolve the pinned Oink module
        run: go mod download

      - name: Build and validate the bilingual site
        run: make check
