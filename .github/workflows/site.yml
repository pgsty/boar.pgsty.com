name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.27.4
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          check-latest: true
          cache: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - name: Resolve the pinned Oink module
        run: go mod download

      - name: Build and validate the bilingual site
        run: make check
