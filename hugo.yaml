title: Boar
baseURL: https://boar.pgsty.com/
enableRobotsTXT: true
enableGitInfo: false
defaultContentLanguage: en

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Boar
    params:
      description: PostgreSQL control plane for Pigsty
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 20
        - identifier: docs-status
          parent: docs
          name: Status and roadmap
          pageRef: /docs/develop/roadmap
          weight: 5
          params:
            icon: fa-solid fa-route
            description: Accepted capabilities, development work, and planned releases
        - identifier: docs-start
          parent: docs
          name: Get started
          pageRef: /docs/start
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: Install, configure, and choose a runtime mode
        - identifier: docs-concepts
          parent: docs
          name: Core concepts
          pageRef: /docs/concepts
          weight: 20
          params:
            icon: fa-solid fa-cubes-stacked
            description: Resources, capabilities, plans, operations, and risk
        - identifier: docs-manage
          parent: docs
          name: Manage PostgreSQL
          pageRef: /docs/manage
          weight: 30
          params:
            icon: fa-solid fa-database
            description: Direct PostgreSQL, Patroni, Pigsty, and Site Agent
        - identifier: docs-reference
          parent: docs
          name: Reference
          pageRef: /docs/reference
          weight: 40
          params:
            icon: fa-solid fa-book-open
            description: CLI, API, configuration, errors, and compatibility
        - identifier: docs-admin
          parent: docs
          name: Administration
          pageRef: /docs/admin
          weight: 50
          params:
            icon: fa-solid fa-shield-halved
            description: Security, upgrades, recovery, licensing, and audit
        - identifier: docs-develop
          parent: docs
          name: Development
          pageRef: /docs/develop
          weight: 60
          params:
            icon: fa-solid fa-code
            description: Roadmap, repository, tests, and contribution flow
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 40
        - identifier: blog-article
          parent: blog
          name: Articles
          pageRef: /blog/article
          weight: 10
          params:
            icon: fa-solid fa-feather-pointed
            description: Long-form technical articles
        - identifier: blog-design
          parent: blog
          name: Design notes
          pageRef: /blog/design
          weight: 20
          params:
            icon: fa-solid fa-compass-drafting
            description: Product contracts and architecture decisions
        - identifier: blog-release
          parent: blog
          name: Release notes
          pageRef: /blog/release
          weight: 30
          params:
            icon: fa-solid fa-tags
            description: Version changes, upgrades, and compatibility
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/boar
          weight: 90
          params:
            icon: fa-brands fa-github

  zh:
    label: 简体中文
    locale: zh-CN
    hasCJKLanguage: true
    weight: 2
    title: Boar
    params:
      description: Pigsty 的 PostgreSQL 控制平面
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 20
        - identifier: docs-status
          parent: docs
          name: 状态与路线图
          pageRef: /docs/develop/roadmap
          weight: 5
          params:
            icon: fa-solid fa-route
            description: 已验收能力、开发中工作与版本计划
        - identifier: docs-start
          parent: docs
          name: 快速上手
          pageRef: /docs/start
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: 安装、配置并选择运行模式
        - identifier: docs-concepts
          parent: docs
          name: 核心概念
          pageRef: /docs/concepts
          weight: 20
          params:
            icon: fa-solid fa-cubes-stacked
            description: 资源、能力、计划、操作与风险
        - identifier: docs-manage
          parent: docs
          name: 管理 PostgreSQL
          pageRef: /docs/manage
          weight: 30
          params:
            icon: fa-solid fa-database
            description: 直连 PostgreSQL、Patroni、Pigsty 与 Site Agent
        - identifier: docs-reference
          parent: docs
          name: 参考手册
          pageRef: /docs/reference
          weight: 40
          params:
            icon: fa-solid fa-book-open
            description: CLI、API、配置、错误与兼容性
        - identifier: docs-admin
          parent: docs
          name: 管理维护
          pageRef: /docs/admin
          weight: 50
          params:
            icon: fa-solid fa-shield-halved
            description: 安全、升级、恢复、许可证与审计
        - identifier: docs-develop
          parent: docs
          name: 开发指南
          pageRef: /docs/develop
          weight: 60
          params:
            icon: fa-solid fa-code
            description: 路线图、仓库、测试与贡献流程
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 40
        - identifier: blog-article
          parent: blog
          name: 专题文章
          pageRef: /blog/article
          weight: 10
          params:
            icon: fa-solid fa-feather-pointed
            description: 深度技术专题
        - identifier: blog-design
          parent: blog
          name: 设计笔记
          pageRef: /blog/design
          weight: 20
          params:
            icon: fa-solid fa-compass-drafting
            description: 产品合同与架构决策
        - identifier: blog-release
          parent: blog
          name: 发布注记
          pageRef: /blog/release
          weight: 30
          params:
            icon: fa-solid fa-tags
            description: 版本变化、升级与兼容性
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/boar
          weight: 90
          params:
            icon: fa-brands fa-github

params:
  version: control-plane-v2
  productionURL: https://boar.pgsty.com
  logo: icons/logo.svg
  copyright:
    authors: '[PGSTY](https://pgsty.com/) contributors · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    from_year: 2026
    to_year: present
  footer_center_info: 'Built with [Oink](https://oink.pgsty.com/)'
  github_repo: https://github.com/pgsty/boar.pgsty.com
  github_project_repo: https://github.com/pgsty/boar
  github_branch: main
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 90
  offline_search_max_results: 12
  page_width: normal
  time_format_blog: 2006-01-02
  ui:
    compare: true
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    typography: technical
    theme_color: '#a24624'
    theme_color_dark: '#e68a62'
    dark_mode: true
    navbar_autohide: false
    section_index: cards
    section_index_columns: 2
    blog_index: cards
    blog_index_columns: 3
    blog_index_toggle: true
    quick_links: [docs, blog]
    sidebar_icon_policy: groups
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_expand_levels: 2
    page_context_menu:
      enable: true
      assistant_links: false
    annotation: true
    backlinks: true
    translation_notice: false
    reading_time: true
    share: [x, bluesky, linkedin, email, copy]
taxonomies:
  tag: tags
  category: categories
  series: series

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
  mounts:
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
